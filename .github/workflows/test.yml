name: Windows tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-Workaround.ps1
      - name: Test with PowerShell 7
        shell: pwsh
        run: ./tests/Test-Workaround.ps1
